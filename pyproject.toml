[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dexibo"
version = "0.3.0"
description = "Dexibo — lite fintech intelligence for ~4GB local LLMs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jazz Forbes-Browne" }]
keywords = ["fintech", "llm", "local", "llama", "assistant"]
dependencies = [
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "huggingface-hub>=0.23.0",
    "typer>=0.12.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
llm = ["llama-cpp-python>=0.2.90"]
web = ["fastapi>=0.115.0", "uvicorn[standard]>=0.30.0"]
all = ["dexibo[llm]"]

[project.scripts]
dexibo = "dexibo.cli:app"

[project.urls]
Homepage = "https://github.com/example/dexibo"

[tool.setuptools.packages.find]
where = ["."]
include = ["dexibo*"]

[tool.setuptools.package-data]
dexibo = ["py.typed"]
